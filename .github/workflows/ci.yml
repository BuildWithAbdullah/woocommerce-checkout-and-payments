name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  suite:
    name: node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every entry names all three components. A bare major is not a tested
        # promise, because actions/setup-node resolves it to the newest release
        # of that line, so the job would quietly stop testing the version the
        # package says it supports.
        node-version: ['20.18.1', '22.23.4', '24.11.1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: the runtime is the version the matrix asked for
        run: node -e "if (process.versions.node !== '${{ matrix.node-version }}') { throw new Error('asked for ${{ matrix.node-version }} and got ' + process.versions.node); }"

      - name: every module parses
        run: |
          for file in $(git ls-files '*.mjs'); do
            node --check "$file"
          done

      - name: the suite
        run: npm test

      - name: the test count is the same on this version as on the others
        run: node tools/count-tests.mjs

      - name: the real binary over every artefact, directly and through a symlink
        run: node tools/exit-codes.mjs

      - name: the real checkers through both output modes
        run: node tools/audit-verdicts.mjs

      - name: the entry point is still nothing but wiring
        run: node tools/entry-thin.mjs

      - name: the generated documents are current
        run: node tools/catalogue-doc.mjs --check && node tools/limits-doc.mjs --check

      - name: the repository verifier
        run: node tools/verify.mjs

  php:
    name: every PHP example parses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: lint every PHP artefact
        run: |
          for file in $(git ls-files '*.php'); do
            php -l "$file"
          done

  engines:
    name: install on the declared floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.1'
      - name: the declared floor installs with engine checking on
        run: npm install --engine-strict --no-audit --no-fund

  engines-refusal:
    name: the engines floor actually refuses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.1'
      - name: raising the floor above the runtime makes a strict install fail
        run: |
          node -e "
            const fs = require('node:fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.engines.node = '>=99.0.0';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          if npm install --engine-strict --no-audit --no-fund; then
            echo "a strict install succeeded against a floor of 99.0.0, so the engines field is doing nothing"
            exit 1
          fi
          echo "the floor refused, as it should"
          git checkout -- package.json
