<!-- A summary is rendered, and a keyboard user is never sent to it. -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Checkout</title></head>
<body>
<form name="checkout" class="checkout woocommerce-checkout" method="post" action="/checkout/">
  <div class="woocommerce-error">
    <ul>
      <li>Billing postcode is a required field.</li>
      <li>Billing phone is a required field.</li>
    </ul>
  </div>
  <p class="form-row">
    <label for="billing_postcode">Postcode</label>
    <input type="text" id="billing_postcode" name="billing_postcode" autocomplete="postal-code">
  </p>
  <button type="submit" name="woocommerce_checkout_place_order">Place order</button>
</form>
</body>
</html>
