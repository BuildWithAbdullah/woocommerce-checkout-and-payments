<!-- There is no head element written out. A browser creates one and hoists
     this script into it; this scanner reads only what is written, so the
     script is not in a head and the finding is not reported. -->
<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Checkout</title>
<script src="/wp-content/plugins/acme-checkout/acme-checkout.js"></script>
<form name="checkout" class="checkout woocommerce-checkout" method="post" action="/checkout/">
  <p class="form-row">
    <label for="billing_city">Town or city</label>
    <input type="text" id="billing_city" name="billing_city" autocomplete="address-level2">
  </p>
  <button type="submit" name="woocommerce_checkout_place_order">Place order</button>
</form>
