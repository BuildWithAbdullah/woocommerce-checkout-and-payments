<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Checkout</title></head>
<body>
<form name="checkout" class="checkout woocommerce-checkout" method="post" action="/checkout/">
  <fieldset class="woocommerce-billing-fields">
    <legend>Billing details</legend>

    <p class="form-row">
      <label for="billing_first_name">First name&nbsp;<abbr class="required" title="required">*</abbr></label>
      <input type="text" id="billing_first_name" name="billing_first_name" autocomplete="billing given-name" required>
    </p>

    <p class="form-row">
      <label for="billing_last_name">Last name</label>
      <input type="text" id="billing_last_name" name="billing_last_name" autocomplete="billing family-name">
    </p>

    <p class="form-row">
      <label for="billing_company">Company</label>
      <input type="text" id="billing_company" name="billing_company" autocomplete="billing organization">
    </p>

    <p class="form-row">
      <label for="billing_address_1">Street address <abbr class="required">*</abbr></label>
      <input type="text" id="billing_address_1" name="billing_address_1" autocomplete="billing address-line1" required>
    </p>

    <p class="form-row">
      <label for="billing_postcode">Postcode</label>
      <input type="text" id="billing_postcode" name="billing_postcode" autocomplete="billing postal-code">
    </p>

    <p class="form-row">
      <label for="billing_email">Email address <abbr class="required">*</abbr></label>
      <input type="email" id="billing_email" name="billing_email" autocomplete="billing email" required>
    </p>

    <p class="form-row">
      <label for="billing_phone">Phone</label>
      <input type="tel" id="billing_phone" name="billing_phone" autocomplete="billing tel">
    </p>
  </fieldset>

  <fieldset class="woocommerce-shipping-fields">
    <legend>Ship to a different address</legend>
    <p class="form-row">
      <label for="shipping_first_name">First name</label>
      <input type="text" id="shipping_first_name" name="shipping_first_name" autocomplete="shipping given-name">
    </p>
    <p class="form-row">
      <label for="shipping_address_1">Street address</label>
      <input type="text" id="shipping_address_1" name="shipping_address_1" autocomplete="shipping address-line1">
    </p>
  </fieldset>

  <button type="submit" name="woocommerce_checkout_place_order">Place order</button>
</form>
</body>
</html>
