<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Checkout</title></head>
<body>
<form name="checkout" class="checkout woocommerce-checkout" method="post" action="/checkout/">
  <h3>Billing details</h3>
  <div class="woocommerce-billing-fields">

    <p class="form-row">
      <label for="billing_first_name">First name&nbsp;<abbr class="required" title="required">*</abbr></label>
      <input type="text" id="billing_first_name" name="billing_first_name">
    </p>

    <p class="form-row">
      <input type="text" id="billing_last_name" name="billing_last_name" placeholder="Last name">
    </p>

    <p class="form-row">
      <label for="billing_company_name">Company</label>
      <input type="text" id="billing_company" name="billing_company" autocomplete="organization">
    </p>

    <p class="form-row">
      <label for="billing_address_1">Street address <abbr class="required">*</abbr></label>
      <input type="text" id="billing_address_1" name="billing_address_1" autocomplete="address-line1">
    </p>

    <p class="form-row">
      <label for="billing_postcode">Postcode</label>
      <input type="text" id="billing_postcode" name="billing_postcode" autocomplete="address-level2">
    </p>

    <p class="form-row">
      <label for="billing_email">Email address <abbr class="required">*</abbr></label>
      <input type="email" id="billing_email" name="billing_email" autocomplete="email" required>
    </p>

    <p class="form-row">
      <input type="tel" id="billing_phone" name="billing_phone" aria-label="Phone">
    </p>
  </div>

  <h3>Ship to a different address</h3>
  <div class="woocommerce-shipping-fields">
    <p class="form-row">
      <label for="shipping_first_name">First name</label>
      <input type="text" id="shipping_first_name" name="shipping_first_name" autocomplete="given-name">
    </p>
    <p class="form-row">
      <label for="shipping_address_1">Street address</label>
      <input type="text" id="shipping_address_1" name="shipping_address_1" autocomplete="address-line1">
    </p>
  </div>

  <button type="submit" name="woocommerce_checkout_place_order">Place order</button>
</form>
</body>
</html>
