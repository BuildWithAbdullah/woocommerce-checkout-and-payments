<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Checkout</title>
  <script src="/wp-content/plugins/acme-checkout/acme-checkout.js" defer></script>
</head>
<body>
  <header>
    <a class="cart-contents" href="/cart/">
      Basket <span class="cart-contents-count">3</span>
    </a>
  </header>

  <form name="checkout" class="checkout woocommerce-checkout" method="post" action="/checkout/">
    <div class="woocommerce-billing-fields">
      <p class="form-row">
        <label for="billing_country">Country</label>
        <select id="billing_country" name="billing_country" autocomplete="country">
          <option value="GB">United Kingdom</option>
        </select>
      </p>
    </div>

    <fieldset class="payment_methods">
      <legend>Payment</legend>
      <p>
        <input type="radio" name="payment_method" id="payment_method_paypal" value="paypal" checked>
        <label for="payment_method_paypal">PayPal</label>
      </p>
      <p>
        <input type="radio" name="payment_method" id="payment_method_bacs" value="bacs">
        <label for="payment_method_bacs">Direct bank transfer</label>
      </p>
    </fieldset>

    <button type="submit" name="woocommerce_checkout_place_order">Place order</button>
  </form>

  <script src="https://www.paypal.com/sdk/js?client-id=acme&currency=GBP" defer></script>
</body>
</html>
