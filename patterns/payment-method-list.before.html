<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Checkout</title></head>
<body>
<form name="checkout" class="checkout woocommerce-checkout" method="post" action="/checkout/">
  <h3>Payment</h3>

  <div class="payment_methods">
    <div class="method" data-payment-method="card">
      <span>Card</span>
    </div>
    <div class="method" data-payment-method="paypal">
      <span>PayPal</span>
    </div>
    <div class="method" data-payment-method="bacs">
      <span>Direct bank transfer</span>
    </div>
  </div>

  <div class="payment_box" id="payment-box-card">
    <p>Your card details are collected by our payment provider.</p>
    <p class="form-row">
      <label for="card_name">Name on card</label>
      <input type="text" id="card_name" name="card_name" autocomplete="cc-name">
    </p>
  </div>

  <p class="form-row terms">
    <input type="checkbox" name="terms" id="terms">
    <span>I have read and agree to the website terms and conditions, which cover delivery
    windows, returns and how we handle your details.</span>
  </p>

  <a href="#" class="button alt place-order">Place order</a>
</form>
</body>
</html>
